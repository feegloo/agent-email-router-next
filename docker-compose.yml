name: agent-email-router-next

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LOG_PATH: /var/log/ollama/server.log
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-600000}
      OLLAMA_MODEL: qwen3.5:0.8b
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: agent-email-router@example.com
      ROUTES_FILE_PATH: /app/data/routes.json
    volumes:
      - routes_data:/app/data
      - ollama_logs:/var/log/ollama:ro
    depends_on:
      mailhog:
        condition: service_started
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  ollama:
    image: ollama/ollama:0.32.2
    entrypoint: ["/bin/sh", "/opt/ollama-entrypoint.sh"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ollama_logs:/var/log/ollama
      - ./docker/ollama-entrypoint.sh:/opt/ollama-entrypoint.sh:ro

  ollama-model-init:
    image: ollama/ollama:0.32.2
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:0.8b
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done

        ollama pull "$$OLLAMA_MODEL"
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailhog:/home/mailhog
    environment:
      MH_STORAGE: maildir
      MH_MAILDIR_PATH: /home/mailhog

volumes:
  routes_data:
    name: agent-email-router-next_routes_data
  ollama_data:
    name: agent-email-router-next_ollama_data
  ollama_logs:
    name: agent-email-router-next_ollama_logs
  mailhog:
    name: agent-email-router-next_mailhog
